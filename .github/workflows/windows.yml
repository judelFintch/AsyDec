name: Installateur Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-windows
  cancel-in-progress: true
jobs:
  construire:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt 'pyinstaller==6.22.3'
      - name: Tester les mises à jour Mac et Windows
        run: python -m unittest tests.test_mises_a_jour
      - name: Tester la création et la récupération du compte
        run: >-
          python -m unittest tests.test_connexion
          tests.test_gestion_locale.GestionLocaleTest.test_recreation_compte_illisible_archive_original_et_preserve_donnees
          tests.test_gestion_locale.GestionLocaleTest.test_recreation_refuse_compte_lisible_meme_bloque
          tests.test_gestion_locale.GestionLocaleTest.test_recreation_valide_identifiants_avant_archivage
          tests.test_gestion_locale.GestionLocaleTest.test_echec_recreation_restaure_compte_illisible_et_conserve_copie
          tests.test_gestion_locale.GestionLocaleTest.test_recreation_ne_remplace_pas_un_compte_cree_entretemps
      - name: Vérifier Inno Setup
        shell: pwsh
        run: |
          $compilateur = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compilateur)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compilateur)) { throw 'Compilateur Inno Setup 6 introuvable' }
      - name: Construire le setup
        run: python scripts/construire_windows.py
      - name: Vérifier l’installation et le démarrage
        timeout-minutes: 3
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'AsyDec-installation'
          $setup = Start-Process -FilePath 'dist/AsyDec-Setup-windows-x64.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation échouée : $($setup.ExitCode)" }
          $env:ASYDEC_HOME = Join-Path $env:RUNNER_TEMP 'asydec-diagnostic'
          $diagnostic = Start-Process -FilePath "$destination/AsyDec.exe" -ArgumentList '--diagnostic' -Wait -PassThru
          Get-Content (Join-Path $env:ASYDEC_HOME 'diagnostic.log')
          if ($diagnostic.ExitCode -ne 0) { throw 'Diagnostic échoué' }
          $interface = Start-Process -FilePath "$destination/AsyDec.exe" -ArgumentList '--test-interface' -Wait -PassThru
          Get-Content (Join-Path $env:ASYDEC_HOME 'diagnostic.log')
          if ($interface.ExitCode -ne 0) { throw 'Initialisation interface échouée' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/AsyDec-Setup-windows-x64.exe
            dist/AsyDec-windows-x64.json
  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: distribution
      - name: Publier le setup vérifié
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          CONSTRUCTION: ${{ github.run_number }}
        run: |
          cat > notes.md <<'NOTES'
          Installateur Windows x64. Installation et démarrage vérifiés.

          ## Connexion et compte illisible

          Sur l’écran de connexion, cliquez sur **Créer un compte** si aucun compte n’existe ou si son fichier est illisible.
          Le fichier illisible est sauvegardé avant remplacement, après confirmation ; vos dossiers et factures restent conservés.
          Un compte lisible existant reste protégé. Le compte est local à chaque ordinateur : utilisez un export `.asydec`
          depuis **Paramètres › Transfert** pour reprendre les données d’une autre machine.
          NOTES
          echo "Révision : ${REVISION}" >> notes.md
          gh release create "windows-${CONSTRUCTION}" distribution/* --target "$REVISION" --title "AsyDec Windows 1.0.${CONSTRUCTION}" --notes-file notes.md --latest=false
