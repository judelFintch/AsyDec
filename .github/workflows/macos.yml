name: Application macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-macos
  cancel-in-progress: false
jobs:
  construire:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pyinstaller==6.22.3'
      - name: Tests
        run: python scripts/verifier.py
      - name: Construire
        run: python scripts/construire_mac.py
      - name: Vérifier l’application
        run: |
          ASYDEC_HOME="$RUNNER_TEMP/asydec-diagnostic" dist/AsyDec.app/Contents/MacOS/AsyDec --diagnostic
          ASYDEC_HOME="$RUNNER_TEMP/asydec-diagnostic" dist/AsyDec.app/Contents/MacOS/AsyDec --test-interface
          codesign --verify --deep --strict dist/AsyDec.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/AsyDec-Mac-*.dmg
            dist/AsyDec-macos-${{ matrix.arch }}.dmg
            dist/AsyDec-macos-${{ matrix.arch }}.zip
            dist/AsyDec-macos-${{ matrix.arch }}.json
  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: distribution
      - name: Vérifier les deux versions Mac
        run: |
          for f in AsyDec-Mac-Apple-Silicon-M1-M2-M3-M4.dmg AsyDec-Mac-Intel.dmg \
                   AsyDec-macos-arm64.zip AsyDec-macos-arm64.json AsyDec-macos-x86_64.zip AsyDec-macos-x86_64.json; do
            test -f "distribution/$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
      - name: Rédiger la note de version
        env:
          REVISION: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          ## Connexion et compte illisible

          Sur l’écran de connexion, cliquez sur **Créer un compte** si aucun compte n’existe ou si son fichier est illisible.
          Le fichier illisible est sauvegardé avant remplacement, après confirmation ; vos dossiers et factures restent conservés.
          Un compte lisible existant reste protégé. Le compte est local à chaque ordinateur : utilisez un export `.asydec`
          depuis **Paramètres › Transfert** pour reprendre les données d’une autre machine.

          ## Base d’installation pour une nouvelle machine

          Sur le poste déjà équipé : **Paramètres › Transfert › Exporter une base d’installation**.
          Le fichier `.asydec` inclut les modèles Word CVI/BL, déclaration DEC, facture et packing list disponibles,
          la bibliothèque de factures et les XML. Sur le nouveau poste, importez-le au premier démarrage ou avec
          **Importer des modèles**. Les modèles sont ensuite utilisés automatiquement et conservés lors des mises à jour.
          Cette base privée se copie séparément de l’installateur ; elle ne contient pas le compte de l’ancienne machine.

          ## Sauvegarde complète chiffrée via GitHub

          **Paramètres › Sauvegarde chiffrée** : créez un export complet avec un mot de passe (12 caractères minimum),
          puis publiez le fichier `.asydec.enc` avec un jeton GitHub disposant de Contents en écriture.
          Sur l’autre poste, recherchez les sauvegardes dans ce même écran, saisissez le mot de passe, puis téléchargez et chargez.
          Le contenu est chiffré avant l’envoi ; aucun mot de passe n’est enregistré dans le code ou dans la release.
          Sur un dépôt public, le fichier chiffré reste téléchargeable ; le mot de passe est indispensable pour le déchiffrer.
          Les mises à jour du logiciel ne remplacent pas les données automatiquement.

          ## Installateur Mac

          | Votre Mac | Fichier à télécharger |
          |---|---|
          | Puce **Apple M1, M2, M3 ou M4** (Apple Silicon) | `AsyDec-Mac-Apple-Silicon-M1-M2-M3-M4.dmg` |
          | Processeur **Intel** | `AsyDec-Mac-Intel.dmg` |

          **Comment savoir ?** Menu  › *À propos de ce Mac* : la ligne « Puce » indique Apple M1/M2/M3/M4,
          la ligne « Processeur » indique Intel.

          Ouvrez le `.dmg`, puis glissez AsyDec dans Applications. Les puces M1, M2, M3 et M4 utilisent la même version.

          Les fichiers `AsyDec-macos-*.zip` et `.json` servent aux mises à jour automatiques depuis l’application :
          inutile de les télécharger.
          NOTES
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "Révision : ${REVISION}" >> notes.md
      - name: Publier après réussite des deux constructions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          CONSTRUCTION: ${{ github.run_number }}
        run: |
          gh release create "macos-${CONSTRUCTION}" distribution/* --target "$REVISION" --title "AsyDec Mac 1.0.${CONSTRUCTION} · Apple Silicon (M1, M2, M3, M4) et Intel" --notes-file notes.md --latest
